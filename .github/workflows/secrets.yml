name: Secrets

# Scans every commit for secrets with gitleaks, using the repository's .gitleaks.toml. The
# pre-commit hook in .githooks checks a commit before it is made; this catches whatever got past it (a clone without
# the hook, a commit made with --no-verify). GitHub push protection is on for this public repository as well;
# this also covers what push protection has no pattern for.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (checksum checked)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the whole history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --log-opts="--all"
